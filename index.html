<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="KSIL Apps builds thoughtful apps, including Ascend: Fitness Planner.">
    <title>KSIL Apps</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f7f9fc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 43rem);
        padding: clamp(2rem, 6vw, 4rem);
        background: #fff;
        border: 1px solid #e3e8f1;
        border-radius: 1.5rem;
        box-shadow: 0 1.25rem 3.75rem rgba(23, 32, 51, .08);
      }

      .eyebrow {
        margin: 0 0 .8rem;
        font-size: .78rem;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #50617d;
      }

      h1 { margin: 0; font-size: clamp(2.25rem, 7vw, 4.25rem); letter-spacing: -.055em; }
      .intro { margin: 1.25rem 0 2.25rem; color: #526078; font-size: 1.1rem; line-height: 1.65; }
      h2 { margin: 0 0 1rem; font-size: 1.35rem; }
      nav { display: grid; gap: .75rem; }
      a {
        display: block;
        padding: 1rem 1.15rem;
        color: #172033;
        text-decoration: none;
        font-weight: 650;
        background: #f3f6fb;
        border-radius: .8rem;
      }
      a:hover, a:focus-visible { background: #e7eefb; outline: 3px solid #7da8ef; outline-offset: 2px; }
      footer { margin-top: 2.5rem; color: #69758a; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">KSIL Apps</p>
      <h1>Apps built with care.</h1>
      <p class="intro">KSIL Apps develops useful, thoughtfully designed mobile applications.</p>

      <h2>Ascend: Fitness Planner</h2>
      <nav aria-label="Ascend resources">
        <a href="/ascend-legal/">Visit Ascend</a>
        <a href="/ascend-legal/privacy-policy.html">Ascend Privacy Policy</a>
        <a href="/ascend-legal/terms-of-use.html">Ascend Terms of Use</a>
        <a href="/ascend-legal/support.html">Ascend Support</a>
      </nav>

      <footer>© <span id="year"></span> KSIL Apps</footer>
    </main>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
